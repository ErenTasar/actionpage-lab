name: Live relay smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://actionpage-origin-probe.pages.dev
      BUILD_SHA256: be5bd5328f79a37027d830686f765a887ec92955d4ecaa74470ba4d529e95381
    steps:
      - name: Fetch the machine entry point
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --dump-header root.headers \
            "$BASE_URL/" > root.json
          jq -e '
            .state == "choice" and
            (.actions | length) == 1 and
            .actions[0].id == "mgm-forecast" and
            .unavailable_operations[0].id == "rg-fihrist" and
            .unavailable_operations[0].reason ==
              "hosting_egress_quarantined" and
            .generic_proxy == false and
            .caller_chosen_egress == false
          ' root.json
          grep -Eiq '^cache-control:.*no-store' root.headers

      - name: Confirm the Resmi Gazete carrier quarantine
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --output rg.json \
            --write-out '%{http_code}' \
            "$BASE_URL/r/rg-fihrist?date=2026-06-26" > rg.status
          cat rg.status
          jq -e '
            .state == "unavailable" and
            .validation.passed == false and
            .validation.reason == "hosting_egress_quarantined" and
            .result == null and
            .receipt == null
          ' rg.json

      - name: Validate the MGM result
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --output mgm.json \
            --write-out '%{http_code}' \
            "$BASE_URL/r/mgm-forecast?location=Bodrum" > mgm.status
          cat mgm.status
          jq -e --arg build "$BUILD_SHA256" '
            .state == "complete" and
            .validation.passed == true and
            .validation.reason == "intent_matches_response" and
            .result.location == "Bodrum" and
            .result.province == "Mu\u011fla" and
            (.result.days | length) == 5 and
            .receipt.network_requests == 2 and
            .policy.implementation_sha256 == $build and
            .policy.authorization == "allow"
          ' mgm.json

      - name: Preserve the static origin marker
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "$BASE_URL/probe.json" > probe.json
          jq -e '
            .marker == "AP-ORIGIN-V1-20260727-M7Q4" and
            .marker_sha256 ==
              "17e4b754f1f3f3f21eb3ce01919f6a3f6894a0f7cf4a0ad281b0b0337ba654bc"
          ' probe.json

      - name: Enforce the complete live matrix
        run: |
          set -euo pipefail
          printf 'RG status: %s\n' "$(cat rg.status)"
          printf 'MGM status: %s\n' "$(cat mgm.status)"
          jq -c '{state, reason: .validation.reason}' rg.json
          jq -c '{state, reason: .validation.reason}' mgm.json
          test "$(cat rg.status)" = "503"
          test "$(cat mgm.status)" = "200"
